services:
  postgres:
    image: postgres:17
    container_name: skillx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skillx_pgdata:/var/lib/postgresql/data
volumes:
  skillx_pgdata:
